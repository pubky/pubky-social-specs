[package]
name = "pubky-marketplace-specs"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.89"
description = "The marketplace sub-spec of Pubky social, a draft for adoption: listings, drops and shops on the shared post envelope, reviews as social ratings"
readme = "README.md"
repository = "https://github.com/pubky/pubky-social-specs"
license = "MIT"
keywords = ["pubky", "pubky-social", "marketplace", "commerce"]

[dependencies]
pubky-social-specs = { path = "../..", version = "1.1.0-alpha.1" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
base32 = "0.5.1"
base64 = "0.22.1"
# Verifies a purchase attestation under its issuer's key; the same version the replay tooling uses
ed25519-dalek = { version = "3.0.0", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The pubky spelling of a key, to hold the attestation's key decoding to it
pubky = "0.10.0"
