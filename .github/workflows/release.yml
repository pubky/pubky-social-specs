name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every check and build, publish nothing
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The CI workflows themselves, so a release can never pass with less than a PR does.
  rust-checks:
    uses: ./.github/workflows/rust-checks.yml
  native:
    uses: ./.github/workflows/native.yml
  wasm:
    uses: ./.github/workflows/wasm.yml
  # Both npm packages' gates, the e2e migration included
  js-native:
    uses: ./.github/workflows/js-native.yml

  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
      tarball: ${{ steps.pack.outputs.tarball }}
      tarball_bytes: ${{ steps.pack.outputs.tarball_bytes }}
      migrator_tarball: ${{ steps.pack.outputs.migrator_tarball }}
      migrator_tarball_bytes: ${{ steps.pack.outputs.migrator_tarball_bytes }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The toolchain js-native.yml pins: the wasm and src/data.ts follow its Unicode tables
      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown

      - name: Versions agree, and a tag names them and sits on v1 or main
        id: version
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "pubky-social-specs") | .version')
          npm_version=$(jq -r .version pkg/package.json)
          migrator_version=$(jq -r .version migrator/package.json)
          # The migrator runs on the core of its own release and no other
          migrator_core=$(jq -r '.dependencies["pubky-social-specs"]' migrator/package.json)
          if [ "$migrator_version" != "$npm_version" ] || [ "$migrator_core" != "$npm_version" ]; then
            echo "::error::migrator/package.json is $migrator_version on pubky-social-specs $migrator_core, pkg/package.json is $npm_version: one version for all three"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$cargo_version" ] || [ "$GITHUB_REF_NAME" != "v$npm_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME, Cargo.toml $cargo_version and pkg/package.json $npm_version must name one version"
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD origin/v1 && ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::tag $GITHUB_REF_NAME points at $(git rev-parse HEAD), which is on neither origin/v1 nor origin/main"
              exit 1
            fi
          elif [ "$DRY_RUN" = false ]; then
            echo "::error::publishing needs a tag ref, got $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi

          publish=false
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$DRY_RUN" != true ]; then publish=true; fi
          case "$cargo_version" in
            *-*) dist_tag=next prerelease=true ;;
            *) dist_tag=latest prerelease=false ;;
          esac
          {
            echo "version=$cargo_version"
            echo "dist_tag=$dist_tag"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      # The version js-native.yml pins, so the published glue is the one its checks ran
      - name: Install wasm-pack
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: wasm-pack@0.13.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: pkg/.nvmrc

      # No build cache here: this build is what gets published.
      - name: Build and pack both npm packages
        id: pack
        shell: bash
        run: |
          npm ci
          (cd pkg && npm run build)
          tarball=$(cd pkg && npm pack --json --pack-destination .. | jq -r '.[0].filename')
          migrator_tarball=$(cd migrator && npm pack --json --pack-destination .. | jq -r '.[0].filename')
          tarball_bytes=$(stat -c %s "$tarball")
          migrator_tarball_bytes=$(stat -c %s "$migrator_tarball")
          {
            echo "tarball=$tarball"
            echo "tarball_bytes=$tarball_bytes"
            echo "migrator_tarball=$migrator_tarball"
            echo "migrator_tarball_bytes=$migrator_tarball_bytes"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### pubky-social-specs and pubky-social-migrator ${{ steps.version.outputs.version }}"
            echo
            echo "- npm tarballs: $tarball_bytes and $migrator_tarball_bytes bytes"
            echo "- npm dist-tag: ${{ steps.version.outputs.dist_tag }}"
            echo "- publish: ${{ steps.version.outputs.publish }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.migrator_tarball }}
          if-no-files-found: error

  crates:
    needs: [verify, rust-checks, native, wasm, js-native]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.97.0"

      # A version already on crates.io is skipped, as npm's is, so a re-run publishes nothing twice
      - name: Is this version on crates.io
        id: published
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "pubky-social-specs release" \
            "https://crates.io/api/v1/crates/pubky-social-specs/$VERSION")
          case "$status" in
            200) echo "pubky-social-specs $VERSION is already on crates.io"; echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io answered $status"; exit 1 ;;
          esac
        env:
          VERSION: ${{ needs.verify.outputs.version }}

      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.published.outputs.skip != 'true'
        id: auth

      - name: Publish to crates.io
        if: steps.published.outputs.skip != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  npm:
    needs: [verify, rust-checks, native, wasm, js-native]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: pkg/.nvmrc

      - name: npm can publish with OIDC
        run: |
          v=$(npm --version)
          if ! printf '%s\n' 11.5.1 "$v" | sort -V -C; then
            echo "::error::npm $v cannot publish through a trusted publisher, it needs 11.5.1 or newer"
            exit 1
          fi

      # Publish the tarball verify built, not a rebuild.
      - uses: actions/download-artifact@v4
        with:
          name: npm-package

      # The core first: the migrator depends on exactly this version of it. A package already at
      # this version is skipped, so a re-run after the migrator failed publishes only the migrator
      - name: Publish to npm
        run: |
          for pair in "pubky-social-specs:$TARBALL" "pubky-social-migrator:$MIGRATOR_TARBALL"; do
            name="${pair%%:*}" tarball="${pair#*:}"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name $VERSION is already on npm"
              continue
            fi
            npm publish "./$tarball" --access public --tag "$DIST_TAG" --provenance
          done
        env:
          TARBALL: ${{ needs.verify.outputs.tarball }}
          MIGRATOR_TARBALL: ${{ needs.verify.outputs.migrator_tarball }}
          DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
          VERSION: ${{ needs.verify.outputs.version }}

  github-release:
    needs: [verify, crates, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package

      - name: Create the GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" "./$TARBALL" "./$MIGRATOR_TARBALL" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --prerelease="$PRERELEASE" \
            --notes "npm tarballs: pubky-social-specs $TARBALL_BYTES bytes, pubky-social-migrator $MIGRATOR_TARBALL_BYTES bytes

          - crates.io: https://crates.io/crates/pubky-social-specs/$VERSION
          - npm: https://www.npmjs.com/package/pubky-social-specs/v/$VERSION
          - npm: https://www.npmjs.com/package/pubky-social-migrator/v/$VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ needs.verify.outputs.tarball }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          TARBALL_BYTES: ${{ needs.verify.outputs.tarball_bytes }}
          MIGRATOR_TARBALL: ${{ needs.verify.outputs.migrator_tarball }}
          MIGRATOR_TARBALL_BYTES: ${{ needs.verify.outputs.migrator_tarball_bytes }}
