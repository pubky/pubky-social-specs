name: JS Binding Tests

on:
  push:
    branches: [ main, v1 ]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        cache-targets: "wasm32-unknown-unknown"

    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.13.0'

    - name: Install package dev dependencies
      run: |
        cd ./pkg
        npm install

    - name: Build the package
      run: |
        cd ./pkg
        npm run build

    - name: Build left the tracked package files untouched
      run: |
        if [ -n "$(git status --porcelain pkg/)" ]; then
          git status --short pkg/
          exit 1
        fi

    - name: Run JS tests
      run: |
        cd ./pkg
        npm test

    - name: The declarations compile as a consumer compiles them
      run: |
        cd ./pkg
        npm run types

    # pkg/api/index.d.ts is the surface as last agreed; a change to it is made on purpose
    - name: The public surface is the committed one
      run: |
        cd ./pkg
        npm run api

    - name: Bundle size, tree-shaking and cold start
      run: |
        cd ./pkg
        npm run size

    # The package against the crate: recorded answers, then fresh seeded cases per family
    - name: Build the surface oracle
      run: cargo build --release --features surface --bin surface_oracle

    - name: The generated tables are the crate's
      run: |
        cd ./pkg
        node qa/data.mjs --check

    - name: Parity with the crate
      run: |
        cd ./pkg
        npm run score -- --fuzz 50000

    - name: Hostile arguments
      run: |
        cd ./pkg
        node --expose-gc --max-old-space-size=1536 qa/boundary.mjs

    - name: Verify npm package contents
      run: |
        cd ./pkg
        npm pack --dry-run .
        npx --yes publint --strict
        npx --yes @arethetypeswrong/cli --pack --profile esm-only
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
    - uses: actions/checkout@v4

    - name: Start the pubky testnet
      run: |
        docker run -d --name testnet --network host \
          -e TEST_PUBKY_CONNECTION_STRING=postgres://postgres:postgres@localhost:5432/postgres \
          synonymsoft/homeserver-testnet:v0.14.0

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        cache-targets: "wasm32-unknown-unknown"

    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.13.0'

    - name: Install package dev dependencies
      run: |
        cd ./pkg
        npm install

    - name: Build the package
      run: |
        cd ./pkg
        npm run build

    - name: Wait for the homeserver and the relays
      run: |
        # 6286 is the homeserver's HTTP port, 15411 the pkarr relay, 15412 the HTTP relay. The
        # ports open before the homeserver publishes its record, and a signup before that fails.
        up() { (echo > "/dev/tcp/localhost/$1") 2>/dev/null; }
        record() { curl -sf -o /dev/null http://localhost:15411/8pinxxgqs41n4aididenw5apqp1urfmzdztr8jt4abrkdn435ewo; }
        export -f up record
        if ! timeout 180 bash -c 'until up 6286 && up 15411 && up 15412 && record; do sleep 2; done'; then
          echo "The testnet did not open ports 6286, 15411 and 15412 and publish its homeserver within 180 s"
          docker logs testnet
          exit 1
        fi

    - name: Run the live migration
      run: |
        cd ./pkg
        npm run e2e

    - name: Testnet logs
      if: failure()
      run: docker logs testnet
