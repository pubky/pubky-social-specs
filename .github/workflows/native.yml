name: Rust (native)

on:
  workflow_dispatch:
  push:
    branches: ["main", "v1"]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Check OpenAPI feature
        run: cargo check --features openapi

      - name: Run native tests
        run: cargo nextest run --no-fail-fast

      # `surface` adds the oracle the npm package is checked against, and the test that the
      # recorded answers under vectors/js are the ones the crate gives now
      - name: Run native tests with the migrator, the replay tooling and the surface oracle
        run: cargo nextest run --no-fail-fast --features replay,surface

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV compatibility (native)
        run: cargo check --locked --all-features
      - name: Check MSRV compatibility (wasm32)
        run: cargo check --locked --all-features --target wasm32-unknown-unknown
