name: Rust Checks

on:
  workflow_dispatch:
  push:
    branches: ["main", "v1"]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "lint"
          cache-on-failure: true

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "package"
          cache-on-failure: true

      - name: Cargo.toml and pkg/package.json agree on the version
        shell: bash
        run: |
          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          npm_version=$(jq -r .version pkg/package.json)
          if [ "$cargo_version" != "$npm_version" ]; then
            echo "::error::Cargo.toml is $cargo_version but pkg/package.json is $npm_version"
            exit 1
          fi

      - name: Verify crates.io package
        run: cargo publish --dry-run --locked

  old-names:
    name: no pre-rename identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The frozen 0.x reader and its fixtures carry the old names on purpose.
      - run: '! git grep -n -E "PubkyApp[A-Za-z]|pubky_app_specs|pubky-app-specs" -- . ":!SPEC.md" ":!docs/SPEC_V0.md" ":!.github/workflows/rust-checks.yml" ":!src/models/legacy_v0/**" ":!tests/fixtures/legacy_v0/**" ":!tests/legacy_v0_replay.rs" ":!tests/qa_transform_fuzz.rs" ":!src/bin/replay_remap.rs" ":!src/bin/replay_verify.rs"'
