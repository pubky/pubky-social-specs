name: Rust (Wasm-Pack)

on:
  workflow_dispatch:
  push:
    branches: ["main", "v1"]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The wasm is the migrator alone; its behaviour is tested through the npm package, which
  # loads it (js-binding.yml). Here it only has to build clean for its target.
  wasm-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint the migrator for wasm32
        run: cargo clippy --target wasm32-unknown-unknown --features migrator -- -D warnings
