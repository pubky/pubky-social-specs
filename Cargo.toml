[package]
name = "pubky-social-specs"
version = "1.0.0-alpha.5"
edition = "2021"
rust-version = "1.89"
description = "Pubky social data models with validation, sanitization, and URI helpers"
readme = "README.md"
homepage = "https://pubky.app"
repository = "https://github.com/pubky/pubky-social-specs"
license = "MIT"
documentation = "https://docs.rs/pubky-social-specs"
keywords = ["pubky", "pubky-social", "nexus", "social", "watcher"]
exclude = [
    ".github",
    "pkg",
    "src/bin",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bundle_specs_npm"
# The npm build ships the transforms and writes their data twin from the native crate
required-features = ["migrator"]

[[bin]]
name = "surface_oracle"
required-features = ["surface"]

[[bin]]
name = "replay_remap"
required-features = ["replay"]

[[bin]]
name = "replay_verify"
required-features = ["replay"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# url and mime are quarantined: the frozen v0 reader is their only consumer, the v1
# surface parses paths itself.
url = "2.5.8"
mime = "0.3"
base32 = "0.5.1"
base64 = "0.22.1"
blake3 = "1.8.6"
utoipa = { version = "5.5.0", optional = true }
# Derives the replay's replica keys. The pubky crate has them too, but not on wasm32.
ed25519-dalek = { version = "3.0.0", optional = true, default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.68"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pubky = "0.10.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.52.3", features = ["full"] }
anyhow = "1.0.100"

[features]
openapi = ["utoipa"]
# The v0 to v1 transforms. Off by default for the crate: only a client that runs the
# migration needs them. The npm package is built with them, since it is that client.
migrator = []
# The JS surface answered natively, with the clock given by the caller: what the TypeScript
# package is checked against.
surface = ["migrator"]
# The replay tooling under tools/replay: the migrator plus the key derivation of the replica.
replay = ["migrator", "dep:ed25519-dalek"]

[profile.release]
opt-level = "z"   # Requests maximum optimization for binary size (“z” stands for “size”), rather than speed.
lto = true        # Enables link-time optimization, allowing the compiler to do more aggressive inlining/dead-code elimination across crates.
codegen-units = 1 # Forces compilation into a single code-generation unit, further helping inlining and dead-code elimination at link time.
panic = "abort"   # Ensures panics do not generate extra stack-unwinding code, reducing binary bloat. Panics will simply abort execution.
